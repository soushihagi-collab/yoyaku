<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>個別指導予約</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>個別指導予約</h1>
</header>

<main class="container">

    <section class="card">
        <h2>個別指導の予約</h2>

        <p>
            個別指導の空き状況を確認し、
            希望する時間を予約できます。
        </p>

        <a href="board.html" class="button">
            予約掲示板を見る
        </a>
    </section>

    <hr>

<h3>管理者</h3>

<button id="adminButton">
    管理者ページ
</button>

<script>

document
    .getElementById("adminButton")
    .addEventListener("click", () => {

        const password =
            prompt("管理者パスワードを入力してください。");


        if (password === null) {
            return;
        }


        if (password === "admin123") {

            location.href = "admin.html";

        } else {

            alert(
                "パスワードが正しくありません。"
            );

        }

    });

</script>
    
</main>

</body>
</html>
