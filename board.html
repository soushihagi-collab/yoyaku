<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個別指導予約掲示板</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>個別指導予約掲示板</h1>

    <p id="connectionStatus">
        接続中...
    </p>

</header>


<main class="container">


    <!-- この画面の説明 -->

    <section class="card">

        <h2>予約方法</h2>

        <p>
            ① 希望する日付を選択してください。
        </p>

        <p>
            ② 予約状況を確認し、空いている時間を選択してください。
        </p>

        <p>
            ③ 生徒名・担当講師・キャンセル用合言葉を入力してください。
        </p>

        <p>
            ④ 「予約する」を押すと予約完了です。
        </p>

    </section>


    <!-- 日付選択 -->

    <section class="card">

        <h2>① 日付を選択</h2>

        <label for="dateSelect">
            予約したい日付
        </label>

        <input
            type="date"
            id="dateSelect"
        >

    </section>


    <!-- 予約掲示板 -->

    <section class="card">

        <h2 id="boardTitle">
            ② 予約状況
        </h2>

        <p>
            空いている時間を確認し、「予約する」ボタンを押してください。
        </p>

        <div id="reservationBoard">

            読み込み中...

        </div>

    </section>


    <!-- 予約フォーム -->

    <section
        id="reservationForm"
        class="card"
        style="display:none;"
    >

        <h2>③ 予約情報を入力</h2>

        <p id="reservationDateTime"></p>


        <label>
            生徒名
        </label>

        <input
            type="text"
            id="studentName"
            placeholder="生徒名を入力"
        >


        <br><br>


        <label>
            担当講師
        </label>

        <select id="teacherSelect">

            <option value="">
                講師を選択してください
            </option>

        </select>


        <br><br>


        <label>
            キャンセル用合言葉
        </label>

        <p>
            <small>
                ※予約をキャンセルするときに必要になります。
                忘れないようにしてください。
            </small>
        </p>

        <input
            type="password"
            id="cancelPassword"
            placeholder="キャンセル時に使用します"
        >


        <br><br>


        <button id="reservationSubmit">
            ④ 予約する
        </button>

    </section>


    <!-- 戻る -->

    <a href="index.html" class="backButton">
        ← 予約サイトに戻る
    </a>


</main>


<!-- Firebase -->

<script
    type="module"
    src="app.js">
</script>


</body>

</html>
