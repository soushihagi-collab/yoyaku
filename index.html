<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>質問予約</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>質問予約</h1>
</header>

<main class="container">

    <!-- 予約について -->
    <section class="card">

        <h2>質問の予約</h2>

        <div class="description">
            <h3>この画面ですること</h3>

            <p>
                質問の予約を行うことができます。
            </p>

            <p>
                まずは「予約掲示板を見る」から、
                希望する日付の空き状況を確認してください。
            </p>
        </div>

        <a href="board.html" class="button">
            予約掲示板を見る
        </a>

    </section>


    <hr>


    <!-- 管理者 -->
    <section class="admin-section">

        <h3>管理者</h3>

        <p class="admin-description">
            管理者の方はこちらから管理者ページへ進んでください。
        </p>

        <button id="adminButton">
            管理者ページ
        </button>

    </section>


</main>


<script>

document
    .getElementById("adminButton")
    .addEventListener("click", () => {

        const password =
            prompt("管理者パスワードを入力してください。");


        if (password === null) {
            return;
        }


        if (password === "admin123") {

            location.href = "admin.html";

        } else {

            alert(
                "パスワードが正しくありません。"
            );

        }

    });

</script>

</body>
</html>
