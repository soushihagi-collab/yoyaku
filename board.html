<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>個別指導予約掲示板</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header>

    <h1>個別指導予約掲示板</h1>

    <p id="connectionStatus">
        接続中...
    </p>

</header>


<main class="container">

    <!-- 日付選択 -->

    <section class="card">

        <label for="dateSelect">
            日付
        </label>

        <input
            type="date"
            id="dateSelect"
        >

    </section>


    <!-- 予約掲示板 -->

    <section class="card">

        <h2 id="boardTitle">
            予約状況
        </h2>

        <div id="reservationBoard">

            読み込み中...

        </div>

    </section>


    <!-- 戻る -->

    <a href="index.html" class="backButton">
        ← 予約サイトに戻る
    </a>

</main>


<!-- Firebase -->

<script type="module" src="app.js"></script>

</body>

</html>
